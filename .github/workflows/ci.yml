name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    # Los dos fallos mas caros del producto han sido especificos de Windows
    # (rename con EPERM sobre fichero abierto, rutas con espacios), y es donde
    # esta la mayoria de los usuarios de escritorio.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Los benchmarks del README: deterministas, sin red ni modelo (solo el motor de palabras y el filtro de credenciales).
      - run: npm run bench

  audit:
    # A registry's build log caught 9 advisories this pipeline never looked
    # at. Runs apart from the matrix so a new upstream advisory shows red
    # here without stopping build-and-test; fixing it is usually one
    # `npm audit fix`. Moderate and below pass: they are noted, not blocked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high
