name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste credentials or memory contents you consider private.**
        Security problems: do not open an issue, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence you can. Tool calls and their arguments help.
  - type: input
    id: version
    attributes:
      label: crbro-memory version
      description: "Output of `npx crbro-memory --version`"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options: [Claude Code, Claude Desktop, Cursor, Codex, Windsurf, Docker, Other]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Node version
      placeholder: "Windows 11, Node 22.14"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`npx crbro-memory doctor` output"
      description: Read-only and it does not print credential values. Remove anything you do not want to share.
      render: text
